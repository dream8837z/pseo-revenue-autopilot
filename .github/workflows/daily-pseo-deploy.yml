name: Daily pSEO Data Sync & Deploy

on:
  push:
    branches:
      - main
  schedule:
    # 하루 4회 완전 무인 최신화 (04:00, 10:00, 16:00, 22:00 KST / 01,07,13,19 UTC)
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Fetch 6 public APIs, build 505 pSEO pages & run SEO audit
        env:
          DRY_RUN: "false"
          SITE_NAME: ${{ vars.SITE_NAME || '핀툴랩(FinToolLab) - 금융·부동산·세금·웹도구 올인원 허브' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://dream8837z.github.io/pseo-revenue-autopilot' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'contact@example.com' }}
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          AFFILIATE_DEPOSIT_URL: ${{ secrets.AFFILIATE_DEPOSIT_URL || 'https://link.coupang.com/a/iSVpT5nClE' }}
          AFFILIATE_LOAN_URL: ${{ secrets.AFFILIATE_LOAN_URL || 'https://link.coupang.com/a/iSVq4TcSLA' }}
          AFFILIATE_SUBSIDY_URL: ${{ secrets.AFFILIATE_SUBSIDY_URL || 'https://link.coupang.com/a/iSVrev2q5s' }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || 'fintoollab8837indexnow2026key99' }}
          ENABLE_INDEXNOW: ${{ vars.ENABLE_INDEXNOW || 'true' }}
        run: python3 -m pseo_engine run

      - name: Keep-Alive monthly sync heartbeat (prevents GitHub 60-day cron pause)
        if: github.event_name == 'schedule'
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" = "01" ] || [ "$DAY" = "15" ]; then
            mkdir -p data
            printf '{"last_auto_sync_utc":"%s","status":"ok"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/sync_status.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sync_status.json
            git diff --cached --quiet || (git commit -m "chore: automated bi-monthly keep-alive sync [skip ci]" && git push)
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-and-audit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
