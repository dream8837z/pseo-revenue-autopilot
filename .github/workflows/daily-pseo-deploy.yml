name: Daily pSEO Data Sync & Deploy

on:
  push:
    branches:
      - main
  schedule:
    # 매일 새벽 04:00 KST (19:00 UTC) 무인 자동 갱신 및 배포
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Fetch public APIs, build pSEO site & run SEO audit
        env:
          DRY_RUN: "false"
          SITE_NAME: ${{ vars.SITE_NAME || '머니핀랩 - 금융·보조금 실시간 계산기' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://dream8837z.github.io/pseo-revenue-autopilot' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'contact@example.com' }}
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          AFFILIATE_DEPOSIT_URL: ${{ secrets.AFFILIATE_DEPOSIT_URL }}
          AFFILIATE_LOAN_URL: ${{ secrets.AFFILIATE_LOAN_URL }}
          AFFILIATE_SUBSIDY_URL: ${{ secrets.AFFILIATE_SUBSIDY_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          ENABLE_INDEXNOW: ${{ vars.ENABLE_INDEXNOW || 'false' }}
        run: python3 -m pseo_engine run

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-and-audit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
